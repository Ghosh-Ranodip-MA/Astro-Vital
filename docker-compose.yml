services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astrovital
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro_demo_only
    ports:
      - "5432:5432"
    volumes:
      - astrovital-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astrovital"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://astro:astro_demo_only@db:5432/astrovital
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  astrovital-db:
  node-modules:
